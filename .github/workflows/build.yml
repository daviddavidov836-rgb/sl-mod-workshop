name: Build exe
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        shell: pwsh
        run: if (!(Test-Path package.json)) { Expand-Archive -Path SL_Workshop_exe_github.zip -DestinationPath . -Force }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: SL_Mod_Workshop
          path: dist/SL_Mod_Workshop.exe
